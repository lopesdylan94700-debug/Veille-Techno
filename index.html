<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veille techno</title>
<meta name="description" content="Nouveautés, roadmap et fins de vie Microsoft 365, Entra, Intune, Defender, Sentinel, Purview, Graph, Apple et Android.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' fill='%23f25022'/%3E%3Crect x='17' y='2' width='13' height='13' fill='%237fba00'/%3E%3Crect x='2' y='17' width='13' height='13' fill='%2300a4ef'/%3E%3Crect x='17' y='17' width='13' height='13' fill='%23ffb900'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Produits" title="Produits">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#news">
      <span class="brand-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text">Veille techno</span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Vues">
      <a href="#news" data-tab="news">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Nouveautés</a>
      <a href="#retire" data-tab="retire">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Fins de vie &amp; retraits</a>
      <a href="#roadmap" data-tab="roadmap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Roadmap</a>
      <a href="#org" data-tab="org">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Organismes</a>
      <a href="#health" data-tab="health">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>État des services</a>
      <a href="#os" data-tab="os">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Versions OS</a>
    </nav>
    <div class="top-actions">
      <span class="live" id="liveStatus" title="État des sources"><span class="dot"></span><span class="txt">Chargement…</span></span>
      <button class="icon-btn" id="refreshBtn" title="Recharger les sources en direct" aria-label="Recharger">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="theme-switch" role="group" aria-label="Thème">
        <button data-theme-set="light" title="Clair" aria-label="Thème clair"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button data-theme-set="dark" title="Sombre" aria-label="Thème sombre"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="box" id="sideContent"></div>
  </aside>

  <main class="main" id="main">
    <p class="eyebrow" id="viewEyebrow">Veille technologique</p>
    <h1 id="viewTitle">Nouveautés</h1>
    <p class="lede" id="viewLede"></p>

    <section class="filters" aria-label="Filtres">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="q" placeholder="Rechercher (ex. SMS, passkey, MC1489971, Autopilot…)" autocomplete="off">
      </div>
      <div class="filter-row" id="periodRow">
        <span class="filter-label">Période</span>
        <div class="chips" id="periodChips"></div>
        <span class="custom-range" id="customRange" hidden>
          <input type="date" id="from" aria-label="Du"> <span>→</span> <input type="date" id="to" aria-label="Au">
        </span>
      </div>
      <div class="filter-row" id="horizonRow" hidden>
        <span class="filter-label">Échéances</span>
        <div class="chips" id="horizonChips"></div>
      </div>
      <div class="filter-row" id="sourceRow">
        <span class="filter-label">Sources</span>
        <div class="chips" id="sourceChips"></div>
      </div>
      <div class="filter-row" id="flagRow">
        <span class="filter-label">Options</span>
        <div class="chips" id="flagChips"></div>
      </div>
    </section>

    <div class="new-bar" id="newBar" hidden></div>
    <div class="result-bar">
      <span id="resultCount"></span>
      <span class="result-actions">
        <span class="grp-toggle" id="groupToggle" role="group" aria-label="Regrouper par">
          <span class="filter-label inline">Regrouper par</span>
          <button data-g="feature">Fonctionnalité</button><button data-g="date">Date</button>
        </span>
        <button class="link-btn" id="resetFilters">Réinitialiser les filtres</button>
      </span>
    </div>
    <div id="content" aria-live="polite"></div>
  </main>

  <aside class="rail" id="rail">
    <div class="box">
      <h2 class="eyebrow">Prochaines échéances</h2>
      <ol class="deadlines" id="railDeadlines"></ol>
      <a href="#retire" class="rail-more" id="railMore">Voir toutes les fins de vie →</a>
    </div>
    <div class="box">
      <h2 class="eyebrow">Sources</h2>
      <ul class="sources" id="railSources"></ul>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>

<script src="data/snapshot.js"></script>
<script src="data/mc-fallback.js"></script>
<script src="data/eol-fallback.js"></script>
<script src="data/tenant.js" onerror="void 0"></script>
<script src="app.js"></script>
</body>
</html>
